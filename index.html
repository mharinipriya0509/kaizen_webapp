<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen Mental Health</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* General Layout */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5dc; /* Beige background */
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* Header */
    header {
      background: #fff8e7;
      padding: 1rem;
      text-align: center;
      border-bottom: 2px solid #e0d6b5;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: #4b3f2f;
    }

    /* Navigation Buttons */
    nav {
      margin-top: 1rem;
    }

    .btn {
      border: none;
      padding: 10px 16px;
      margin: 5px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .beige-pink { background: #f5f5dc; color: #d17b88; border: 1px solid #d17b88; }
    .beige-blue { background: #f5f5dc; color: #5a90d1; border: 1px solid #5a90d1; }
    .beige-green { background: #f5f5dc; color: #6c9d7a; border: 1px solid #6c9d7a; }
    .beige-purple { background: #f5f5dc; color: #8a7bc1; border: 1px solid #8a7bc1; }
    .beige-grey { background: #f5f5dc; color: #666; border: 1px solid #666; }
    .beige-orange { background: #f5f5dc; color: #d18c47; border: 1px solid #d18c47; }

    /* Sections */
    .section {
      display: none;
      padding: 20px;
      animation: fadeIn 0.5s ease-in-out;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Chatbox */
    .chat-box {
      background: #fff8e7;
      border: 1px solid #e0d6b5;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .chat-message {
      margin: 5px 0;
      animation: slideIn 0.3s ease-in-out;
    }

    @keyframes slideIn {
      from { transform: translateX(-10px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .chat-user {
      color: #4b3f2f;
      font-weight: bold;
    }

    .chat-bot {
      color: #5a90d1;
      font-style: italic;
    }

    /* Input fields */
    input, button {
      margin: 5px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .list-card {
      background: #fff8e7;
      border: 1px solid #e0d6b5;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Kaizen</h1>
  <nav>
    <button class="btn beige-pink" onclick="showSection('home')">Home</button>
    <button class="btn beige-blue" onclick="showSection('chat')">Chatbot</button>
    <button class="btn beige-green" onclick="showSection('booking')">Booking</button>
    <button class="btn beige-purple" onclick="showSection('resources')">Resources</button>
    <button class="btn beige-grey" onclick="showSection('peer')">Peer Support</button>
    <button class="btn beige-orange" onclick="showSection('admin')">Admin</button>
  </nav>
</header>

<!-- Sections -->
<section id="home" class="section active">
  <h2>Welcome to Kaizen</h2>
  <p>Your mental health companion at college. Explore, chat, and grow!</p>
</section>

<section id="chat" class="section">
  <h2>Chatbot</h2>
  <div id="chatBox" class="chat-box"></div>
  <input type="text" id="chatInput" placeholder="Ask about stress, sleep, motivation..." />
  <button onclick="sendChat()">Send</button>
</section>

<section id="booking" class="section">
  <h2>Book a Session</h2>
  <input type="text" id="name" placeholder="Your Name">
  <input type="date" id="date">
  <input type="time" id="time">
  <button onclick="submitBooking()">Book</button>
  <div id="bookingList" class="list-card"></div>
</section>

<section id="resources" class="section">
  <h2>Resources</h2>
  <div id="resourceTabs">
    <button onclick="showResourceTab('meditation')">Meditation</button>
    <button onclick="showResourceTab('stress')">Stress Relief</button>
    <button onclick="showResourceTab('mindfulness')">Mindfulness</button>
  </div>
  <div id="resourcesContent" class="list-card"></div>
</section>

<section id="peer" class="section">
  <h2>Peer Support</h2>
  <input type="text" id="peerInput" placeholder="Share your thoughts..." />
  <button onclick="submitPeer()">Post</button>
  <div id="peerList" class="list-card"></div>
</section>

<section id="admin" class="section">
  <h2>Admin Dashboard</h2>
  <canvas id="adminChart" width="400" height="200"></canvas>
</section>

<script>
  function showSection(id) {
    document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  // Simple Chatbot Logic
  function sendChat() {
    const input = document.getElementById("chatInput");
    const chatBox = document.getElementById("chatBox");
    const userMessage = input.value.trim();

    if (!userMessage) return;

    // Display user message
    chatBox.innerHTML += `<div class="chat-message"><span class="chat-user">You:</span> ${userMessage}</div>`;

    // Bot reply logic
    let botReply = "I'm here to listen. Tell me more.";
    if (/hello/i.test(userMessage)) {
      botReply = "Hi there 👋 How are you feeling today?";
    } else if (/stress/i.test(userMessage)) {
      botReply = "I hear you’re feeling stressed 😔. Try taking a deep breath with me 🌱 Inhale… Exhale…";
    } else if (/sleep/i.test(userMessage)) {
      botReply = "Sleep is super important 💤. Try avoiding screens before bed!";
    } else if (/motivation/i.test(userMessage)) {
      botReply = "You’re capable of amazing things 🚀. One step at a time!";
    }

    // Display bot reply
    setTimeout(() => {
      chatBox.innerHTML += `<div class="chat-message"><span class="chat-bot">Kaizen Bot:</span> ${botReply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 600);

    input.value = "";
  }

  // Dummy Booking
  function submitBooking() {
    const name = document.getElementById("name").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const list = document.getElementById("bookingList");

    if (name && date && time) {
      list.innerHTML += `<div>📅 ${name} booked for ${date} at ${time}</div>`;
    }
  }

  // Peer Support
  function submitPeer() {
    const text = document.getElementById("peerInput").value;
    const list = document.getElementById("peerList");
    if (text) {
      list.innerHTML += `<div>💬 ${text}</div>`;
    }
  }
</script>
</body>
</html>
